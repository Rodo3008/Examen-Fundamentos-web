<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlorManía</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <h1><span>Flor</span>Manía</h1>
        <section class="links">
            <p id="cursor">Envía Flores</p>
            <p>Nosotros</p>
            <button id="sesion">Iniciar Sesión</button>
        </section>
    </header>
    <nav class="navegacion">
        <p>Girasoles</p>
        <p>Romas</p>
        <p>Claveles</p>
        <p>Tulipanes</p>
        <p>Lirios</p>
        <p>Orquídeas</p>
        <p>Margaritas</p>        
    </nav>
    <main>
    <section class="flor-del-mes">
        <h1>Flor del Mes</h1>
        <img src="images/flor-del-mes.jpg" alt="Flor del Mes">
    </section>
    <section class="resultados">
        <p>Mostrando <span> 50 resultados</span></p>
        <a href="#">Ver más Flores</a>
    </section>
    <section class="flores">
        <figure class="flor">
            <img src="images/ramo-de-rosas.jpg" alt="Ramo de Rosas">
            <section class="info">
                <div>
                    <h2>Ramo de Rosas</h2>
                    <p>$40.00</p>
                </div>
                <button>Comprar</button>
            </section>
        </figure>
                <figure class="flor">
            <img src="images/arreglo-tulipanes.jpg" alt="Arreglo de Tulipanes">
            <section class="info">
                <div>
                    <h2>Arreglo de Tulipanes</h2>
                    <p>$50.00</p>
                </div>
                <button>Comprar</button>
            </section>
        </figure>
                <figure class="flor">
            <img src="images/bouquet-lirios.jpg" alt="Bouquet de Lirios">
            <section class="info">
                <div>
                    <h2>Bouquet de Lirios</h2>
                    <p>$25.00</p>
                </div>
                <button id="comprar">Comprar</button>
            </section>
        </figure>
    </section>
    </main>
    <footer class="footer">
      
    </footer>
</body>

</html>
